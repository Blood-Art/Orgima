[project]
name = "orgima"
version = "0.1.0"
description = "Automation script for organzing and renaming images"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "filetype>=1.2.0",
    "imagehash>=4.3.2",
    "pillow>=12.2.0",
]

[project.scripts]
orgima = "main:main"

[tool.uv]
package = true

[tool.mypy]
mypy_path = ["src"]

explicit_package_bases = true
namespace_packages = true
